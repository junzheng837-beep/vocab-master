name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json 版本 ($PKG) 与 tag ($TAG) 不一致，请先同步版本号"
            exit 1
          fi

      - name: Build web app and site
        run: npm run build
        env:
          # 云同步配置从仓库 Secrets 注入，.env.local 不进仓库
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: dir release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true
          body: |
            ## 下载安装

            下载 `shici-setup.exe`，双击安装即可。安装包约 80 MB，支持 Windows 10 / 11 (64 位)。

            也可以直接[在线使用](https://junzheng837-beep.github.io/vocab-master/app/)，无需安装。

            ## 更新说明

            已经安装过旧版本的，打开软件会在顶部收到更新提示，点「立即更新」即可完成升级，
            学习数据不会丢失。

            ## 数据说明

            词库和学习记录保存在本机。注册账号后，自建词库会归属该账号，
            切换账号互不影响。
