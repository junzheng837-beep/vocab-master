<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; width: 100%; height: 100%; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- 满幅方形版本：交给系统自己裁圆角 -->
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#g)"/>
  <rect width="256" height="256" fill="url(#shine)"/>

  <g transform="translate(128 132) scale(0.86) translate(-128 -128)">
    <rect x="62" y="150" width="132" height="46" rx="16" fill="#ffffff" opacity="0.34"/>
    <rect x="52" y="110" width="152" height="52" rx="17" fill="#ffffff" opacity="0.62"/>
    <rect x="42" y="62" width="172" height="66" rx="19" fill="#ffffff" opacity="0.97"/>
    <rect x="66" y="84" width="76" height="9" rx="4.5" fill="#0A84FF" opacity="0.85"/>
    <rect x="66" y="102" width="46" height="9" rx="4.5" fill="#0A84FF" opacity="0.42"/>
    <path d="M158 92 l12 13 24 -27" fill="none" stroke="#0A84FF" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
</body>
</html>
